# n8n locally, to check that the workflows actually import and run.
#
#   docker compose -f docker-compose.local.yml up -d
#
# This is not the production stack (that one has Caddy, domains and TLS):
# here n8n talks to the CRM running on the laptop via `npm run dev`. It's for
# the one thing that can't be checked without n8n: that the files import
# without complaint, that expressions evaluate, and that the triggers fire.
#
# SQLite database on purpose. In production it runs on Postgres because the
# execution history gets corrupted under concurrency, but for a local check
# adding a database would just be noise.

name: agendia-local

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid

      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      # Without this, n8n warns on every startup that the config file
      # permissions are too loose and clutters the log.
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'false'
      N8N_RUNNERS_ENABLED: 'true'

      # The Code nodes read process.env for CRM_URL and CRM_CRON_SECRET.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'

      # The CRM runs on the host, not on Docker's network. In Docker Desktop,
      # host.docker.internal points to the machine.
      CRM_URL: http://host.docker.internal:3000
      CRM_CRON_SECRET: ${CRON_SECRET}

      # The chatbot runs in its own Docker setup, not on this network. From
      # inside the n8n container, `localhost` is n8n itself: confirmed it
      # doesn't reach it. host.docker.internal does.
      #
      # In production this is the chatbot's public URL, and the watchdog
      # lives on ANOTHER machine: one that lived on the machine it's
      # watching would go down with it.
      CHATBOT_URL: http://host.docker.internal:8000

      ALERT_FROM: avisos@ejemplo.local
      ALERT_TO: avisos@ejemplo.local
      GOOGLE_PLACES_URL: https://maps.googleapis.com/maps/api/place/details/json
      GOOGLE_PLACE_ID: ''
      GOOGLE_PLACES_KEY: ''
      SHEET_FACTURAS: ''
      SHEET_MATERIAL: ''
      DRIVE_ENTRADA: ''
      DRIVE_ARCHIVO: ''

      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '72'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - n8n_local:/home/node/.n8n
      - ../clinicas-web/automatizaciones/workflows:/workflows:ro

volumes:
  n8n_local:
