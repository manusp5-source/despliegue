# Full stack for a clinic.
#
#   docker compose --env-file .env up -d
#
# ONE INSTALLATION PER CLINIC. There's no data separation between clinics
# inside the CRM (no model carries organizationId), so two clinics on the
# same stack would see each other's data. It's the product's biggest
# outstanding debt and is documented as DEC-D06.
#
# None of this exposes ports externally except the proxy. The CRM, n8n and
# Langfuse talk to each other over Docker's internal network; what goes out
# to the internet passes through Caddy with TLS.

name: agendia

services:
  # ---------------------------------------------------------------------
  # Data
  # ---------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Without this, a restart with the host's locale changed can alter
      # the order of the text indexes.
      LANG: es_ES.utf8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the n8n and Langfuse databases the first time. They share a
      # server but not a database: if one grows or gets corrupted, it
      # doesn't take the other down with it.
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persistence enabled: the job queue must not be emptied on a restart,
    # or pending sends get lost.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # The application
  # ---------------------------------------------------------------------
  crm:
    build:
      context: ../UnicornIA-CRM
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: https://${DOMINIO_CRM}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      CLINIC_NAME: ${CLINIC_NAME}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      REMINDER_OFFSETS_HOURS: ${REMINDER_OFFSETS_HOURS:-24,2}

  # ---------------------------------------------------------------------
  # Automations
  # ---------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      # Postgres, not SQLite: with SQLite, the execution history gets
      # corrupted as soon as there's concurrency, and that history is
      # exactly what you check when something didn't go right.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_HOST: ${DOMINIO_N8N}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMINIO_N8N}/
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid

      # Without this n8n is left open to anyone who knows the URL.
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Variables used by the workflows. The CRM is called over the internal
      # network, not by going out to the internet and back.
      CRM_URL: http://crm:3000
      CRM_CRON_SECRET: ${CRON_SECRET}
      ALERT_FROM: ${ALERT_FROM}
      ALERT_TO: ${ALERT_TO}
      GOOGLE_PLACES_URL: https://maps.googleapis.com/maps/api/place/details/json
      GOOGLE_PLACE_ID: ${GOOGLE_PLACE_ID}
      GOOGLE_PLACES_KEY: ${GOOGLE_PLACES_KEY}
      SHEET_FACTURAS: ${SHEET_FACTURAS}
      SHEET_MATERIAL: ${SHEET_MATERIAL}
      DRIVE_ENTRADA: ${DRIVE_ENTRADA}
      DRIVE_ARCHIVO: ${DRIVE_ARCHIVO}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'

      # History gets pruned automatically. Without this the database keeps
      # growing forever: each heartbeat run is 288 records a day.
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '336' # 14 days
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflows are mounted read-only so they can be imported from the UI
      # without copying them by hand.
      - ../clinicas-web/automatizaciones/workflows:/workflows:ro

  # ---------------------------------------------------------------------
  # Observability for the AI part
  # ---------------------------------------------------------------------
  #
  # n8n already tells you whether a workflow went well or not. What it does
  # NOT say is what the patient asked the model and what it answered, and
  # that's exactly what needs to be shown when a clinic asks "what did our
  # assistant tell this patient?".
  #
  # Self-hosted on purpose: patient messages pass through here, and that
  # doesn't leave the clinic's installation.
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/langfuse
      NEXTAUTH_URL: https://${DOMINIO_LANGFUSE}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      # Nobody self-registers: accounts are created by the admin.
      AUTH_DISABLE_SIGNUP: 'true'
      TELEMETRY_ENABLED: 'false'

  # ---------------------------------------------------------------------
  # Entry point
  # ---------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [crm, n8n]
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMINIO_CRM: ${DOMINIO_CRM}
      DOMINIO_N8N: ${DOMINIO_N8N}
      DOMINIO_LANGFUSE: ${DOMINIO_LANGFUSE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:
  caddy_data:
  caddy_config:
