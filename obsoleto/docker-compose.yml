# Pila completa de una clínica.
#
#   docker compose --env-file .env up -d
#
# UNA INSTALACIÓN POR CLÍNICA. No hay separación de datos entre clínicas
# dentro del CRM (ningún modelo lleva organizationId), así que dos clínicas
# en la misma pila verían los datos de la otra. Es la mayor deuda pendiente
# del producto y está documentada como DEC-D06.
#
# Nada de esto expone puertos al exterior salvo el proxy. El CRM, n8n y
# Langfuse hablan entre ellos por la red interna de Docker; lo que sale a
# internet pasa por Caddy con TLS.

name: agendia

services:
  # ---------------------------------------------------------------------
  # Datos
  # ---------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Sin esto, un reinicio con el locale del host cambiado puede alterar
      # el orden de los índices de texto.
      LANG: es_ES.utf8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Crea las bases de n8n y Langfuse la primera vez. Comparten servidor
      # pero no base: si una crece o se corrompe, no se lleva a la otra.
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persistencia activada: la cola de trabajos no debe vaciarse en un
    # reinicio, o se pierden envíos pendientes.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # La aplicación
  # ---------------------------------------------------------------------
  crm:
    build:
      context: ../UnicornIA-CRM
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: https://${DOMINIO_CRM}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      CLINIC_NAME: ${CLINIC_NAME}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      REMINDER_OFFSETS_HOURS: ${REMINDER_OFFSETS_HOURS:-24,2}

  # ---------------------------------------------------------------------
  # Automatizaciones
  # ---------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      # Postgres y no SQLite: con SQLite, el historial de ejecuciones se
      # corrompe en cuanto hay concurrencia, y ese historial es justo donde
      # se mira cuando algo no ha salido.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_HOST: ${DOMINIO_N8N}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMINIO_N8N}/
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid

      # Sin esto n8n queda abierto a quien conozca la URL.
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Variables que usan los workflows. El CRM se llama por la red interna,
      # no dando la vuelta por internet.
      CRM_URL: http://crm:3000
      CRM_CRON_SECRET: ${CRON_SECRET}
      ALERT_FROM: ${ALERT_FROM}
      ALERT_TO: ${ALERT_TO}
      GOOGLE_PLACES_URL: https://maps.googleapis.com/maps/api/place/details/json
      GOOGLE_PLACE_ID: ${GOOGLE_PLACE_ID}
      GOOGLE_PLACES_KEY: ${GOOGLE_PLACES_KEY}
      SHEET_FACTURAS: ${SHEET_FACTURAS}
      SHEET_MATERIAL: ${SHEET_MATERIAL}
      DRIVE_ENTRADA: ${DRIVE_ENTRADA}
      DRIVE_ARCHIVO: ${DRIVE_ARCHIVO}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'

      # El historial se poda solo. Sin esto la base crece sin parar: cada
      # ejecución del latido son 288 registros al día.
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '336' # 14 días
    volumes:
      - n8n_data:/home/node/.n8n
      # Los workflows quedan montados en solo lectura para poder importarlos
      # desde la interfaz sin copiarlos a mano.
      - ../clinicas-web/automatizaciones/workflows:/workflows:ro

  # ---------------------------------------------------------------------
  # Observabilidad de la parte con IA
  # ---------------------------------------------------------------------
  #
  # n8n ya dice si un workflow fue bien o mal. Lo que NO dice es qué le
  # preguntó el paciente al modelo y qué contestó, y eso es justo lo que hay
  # que poder enseñar cuando una clínica pregunta "¿qué le dijo mi asistente
  # a este señor?".
  #
  # Autoalojado a propósito: por ahí pasan mensajes de pacientes, y eso no
  # sale de la instalación de la clínica.
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/langfuse
      NEXTAUTH_URL: https://${DOMINIO_LANGFUSE}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      # Nadie se registra solo: las cuentas las crea quien administra.
      AUTH_DISABLE_SIGNUP: 'true'
      TELEMETRY_ENABLED: 'false'

  # ---------------------------------------------------------------------
  # Entrada
  # ---------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [crm, n8n]
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMINIO_CRM: ${DOMINIO_CRM}
      DOMINIO_N8N: ${DOMINIO_N8N}
      DOMINIO_LANGFUSE: ${DOMINIO_LANGFUSE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:
  caddy_data:
  caddy_config:
